<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --primary: #1a73e8;
    --accent: #ffb703;
    --ink: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "PingFang TC", "Hiragino Sans GB", "Heiti TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .cover {
    position: relative;
    width: 1200px;
    height: 630px;
    background-color: #0b1f33;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url("__BG__");
    background-size: cover;
    background-position: center;
  }
  .gradient {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(100deg, rgba(4, 26, 51, 0.92) 0%, rgba(4, 26, 51, 0.65) 40%, rgba(4, 26, 51, 0.25) 100%),
      linear-gradient(0deg, rgba(4, 26, 51, 0.55) 0%, rgba(4, 26, 51, 0) 45%);
  }
  .content {
    position: absolute;
    inset: 0;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .series-badge {
    display: inline-block;
    background: var(--accent);
    color: #101010;
    font-size: 26px;
    font-weight: 800;
    padding: 8px 22px;
    border-radius: 40px;
    letter-spacing: 2px;
  }
  .home-badge {
    display: inline-block;
    border: 2px solid rgba(255,255,255,0.75);
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    padding: 6px 20px;
    border-radius: 40px;
    letter-spacing: 1px;
  }
  .title {
    color: var(--ink);
    font-size: 58px;
    font-weight: 900;
    line-height: 1.32;
    max-width: 940px;
    text-shadow: 0 3px 18px rgba(0,0,0,0.5);
    letter-spacing: 1px;
  }
  .title .hl {
    color: var(--accent);
  }
  .bottom-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: rgba(255,255,255,0.92);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
  }
  .date {
    font-size: 22px;
    font-weight: 500;
    opacity: 0.85;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="bg"></div>
    <div class="gradient"></div>
    <div class="content">
      <div class="top">
        <span class="series-badge">__SERIES__</span>
        <span class="home-badge">__SUBTITLE__</span>
      </div>
      <h1 class="title">__TITLE__</h1>
      <div class="bottom-line">
        <div class="brand">
          <span class="brand-logo">宅</span>
          <span>充滿意外的宅爸人生</span>
        </div>
        <div class="date">__DATE__</div>
      </div>
    </div>
  </div>
</body>
</html>
